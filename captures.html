<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Auto Click – Captures</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; vertical-align: top; }
    th { background: #f5f5f5; }
    button { margin: 20px 0; padding: 8px 14px; cursor: pointer; }
    code { font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <h1>Captures archivées</h1>
  <p><code>Les images et fichiers .txt sont dans Téléchargements/captures/.</code></p>
  <button id="refresh">Rafraîchir</button>
  <button id="clear">Vider l’historique</button>
  <table>
    <thead><tr><th>Date</th><th>Titre</th><th>Sous-texte</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script src="captures.js"></script>
</body>
</html>
